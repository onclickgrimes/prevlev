<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="ui.css" />
    <title>Prevlev</title>
  </head>
  <body class="popup">
    <div class="brand">
      <span class="mark">P</span><strong>Prevlev</strong
      ><span class="pill">0.2</span>
    </div>
    <h1>Seu laboratório<br />de vídeos.</h1>
    <p>Pesquisa, imagens e ferramentas locais para o YouTube.</p>
    <button id="open" class="primary">Abrir espaço de trabalho ↗</button
    ><button id="scan">Coletar desta aba</button
    ><label class="toggle"
      ><input id="shorts" type="checkbox" /> Ocultar Shorts no YouTube</label
    >
    <p id="status" role="status" aria-live="polite"></p>
    <small>Sem telemetria. Backend próprio opcional.</small>
    <script src="popup.js"></script>
  </body>
</html>
